[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "origenerator"
version = "0.1.0"
description = "Local ComfyUI frontend with metadata tracking and gallery browser"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "Pillow",
    "opencv-python>=4.8",
    "websockets",
    "numpy",
    # Auto-aiming the ATI stroke track: a censor-detection YOLO finds the anchor
    # in a start frame so the user never places coordinates by hand
    # (workflows/stroke_aim). onnxruntime executes it; huggingface_hub fetches
    # and caches its weights.
    "onnxruntime",
    "huggingface_hub",
]

[project.scripts]
origenerator = "origenerator.app:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-timeout", "vulture"]
# Voice-command prompt editing: local speech-to-text + mic capture. Heavy and
# optional — the mic button degrades gracefully when these aren't installed.
# Install with:  pip install -e .[voice]
voice = ["faster-whisper", "sounddevice"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan, which walks the largest tree in the family and takes
# ~38 s on this machine, so 240 s clears it six times over and can only bite on a
# hang. The thread method prints the hung stack, which is what turns a stalled
# required check into a one-line diagnosis. tests/test_timeouts.py holds both
# halves of it.
addopts = "--timeout=240 --timeout-method=thread"
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.setuptools.packages.find]
include = ["origenerator*"]
namespaces = false

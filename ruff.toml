line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "E402",  # 30
    "PLR0913",  # 131
    "RUF001",  # 117
    "PLW0108",  # 28
    "RUF059",  # 56
    "PLR0917",  # 46
    "PLR0915",  # 7
    "PLR0911",  # 6
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "E402", "PLR0913", "RUF001", "PLW0108", "RUF059", "PLR0917", "PLR0915", "PLR0911"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"

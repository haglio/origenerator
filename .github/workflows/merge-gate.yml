# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "app_support shared_ui player_core"
      python-version: "3.12"
      # A pull request's run is one pass; the queue's and main's are two, because
      # the reverse pass is skipped on a pull request and nowhere else. So the
      # number that matters here is twice what a PR run reports -- and at 38 the
      # queue began cancelling its own candidate runs mid-suite, which shows up
      # as an eviction with no failing test to point at. 55 leaves room under the
      # queue's own 60-minute ceiling for a check to answer at all.
      timeout-minutes: 55
      qt-platform: offscreen
      reverse-on-pull-request: false

  # What the machine this is developed on would say. It runs 3.14 and the gate
  # runs 3.12, and the two evaluate annotations differently (PEP 649) -- which is
  # exactly the divergence this repo wrote a static guard for. On `push` only:
  # never on a pull request and never in the queue, so this reads without gating
  # and nothing here can hold up a landing.
  next-python:
    if: github.event_name == 'push'
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "app_support shared_ui player_core"
      python-version: "3.14"
      timeout-minutes: 55
      qt-platform: offscreen
      reverse: false

# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "player_core app_support shared_ui"
      python-version: "3.12"
      # One pass of this suite has taken 24 minutes on a slow runner, and a run that
      # hits its ceiling is evicted from the queue with no failing test to point at;
      # 55 is as much as the queue's own 60-minute limit leaves room for.
      timeout-minutes: 55
      qt-platform: offscreen

  # What the machine this is developed on would say. It runs 3.14 and the gate
  # runs 3.12, and the two evaluate annotations differently (PEP 649) -- which is
  # exactly the divergence this repo wrote a static guard for. On `push` only:
  # never on a pull request and never in the queue, so this reads without gating
  # and nothing here can hold up a landing.
  next-python:
    if: github.event_name == 'push'
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      siblings: "player_core app_support shared_ui"
      python-version: "3.14"
      timeout-minutes: 55
      qt-platform: offscreen

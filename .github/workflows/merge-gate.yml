name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest: origenerator is a PyQt6 desktop app whose tests wrap
# Windows-only behaviour (subprocess CREATE_NO_WINDOW, taskbar AUMID, window
# geometry), so an ubuntu runner would diverge. The editable install uses compat
# mode -- the repo dir shares the package's name and would otherwise win as a
# namespace shadow.
#
# app_support is a sibling package too, and unlike the other two it IS installed:
# origenerator asks it to name this process in the task list, and the tests read
# the naming rules from it rather than restating them. The app's own import of it
# is guarded -- a missing app_support costs the name and nothing else -- but a
# test suite that cannot import it cannot check the rules at all.
#
# shared_ui and player_core are sibling packages origenerator imports via
# sys.path (paths.py walks up to the directory that contains each), NOT pip
# dependencies. So we check them out ADJACENT to origenerator under the
# workspace root; that satisfies both the runtime lookup and tests/test_paths.py,
# which asserts the siblings exist on disk. player_core carries the family's
# stroke -- the waveform and its dials, cruise control, and where the drive
# readout's parts sit -- which this app drives the OSR2 from rather than keeping
# a second copy of. All three repos are public, so the default GITHUB_TOKEN can
# clone them.
#
# The suite renders Qt offscreen (QT_QPA_PLATFORM) and mocks every outside
# service -- ComfyUI over websockets, the onnx/hf stroke-aim model -- so no step
# touches the network or a real model. The optional "voice" extra (faster-whisper,
# sounddevice) is deliberately not installed; those imports are lazy and their
# tests inject fakes, so the suite is green without them.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: origenerator

jobs:
  full-suite:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out origenerator
        uses: actions/checkout@v4
        with:
          path: origenerator
      - name: Check out shared_ui adjacent (imported via sys.path, not installed)
        uses: actions/checkout@v4
        with:
          repository: haglio/shared_ui
          path: shared_ui
      - name: Check out player_core adjacent (imported via sys.path, not installed)
        uses: actions/checkout@v4
        with:
          repository: haglio/player_core
          path: player_core
      - name: Check out app_support adjacent (installed below)
        uses: actions/checkout@v4
        with:
          repository: haglio/app_support
          path: app_support
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, compat mode)
        run: |
          python -m pip install --upgrade pip
          pip install -e ../app_support --config-settings editable_mode=compat
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        run: python -m pytest -q

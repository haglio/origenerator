[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "origenerator"
version = "0.1.0"
description = "Local ComfyUI frontend with metadata tracking and gallery browser"
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Every requirement carries a ceiling. Without one each run installs whatever
# PyPI served that morning: that is how this venv came to hold opencv-python 5
# while four of its siblings hold 4, with nothing anywhere saying so. Floors are
# what this repo's venv holds today, and opencv's ceiling is the next major
# rather than the current one because 5 is what this repo actually runs and its
# suite is green on it.
# The family repos this one runs are named at the tags it was built against
# rather than left to be whatever checkouts sit beside it. Unpinned, a change
# landing in one of them reached every consumer the same minute, and one whose
# other half had not landed turned all of them red at once. Moving to a newer
# one is this repo's own commit, with its own suite to answer for it.
dependencies = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.156",
    "player-core @ git+https://github.com/haglio/player_core@v0.1.275",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.129",
    "voice-core @ git+https://github.com/haglio/voice_core@v0.1.17",
    "PyQt6>=6,<7",
    "pillow>=12,<13",
    "opencv-python>=4.8,<6",
    "websockets>=17,<18",
    "numpy>=2.5,<3",
    # Auto-aiming the ATI motion track: a censor-detection YOLO finds the anchor
    # in a start frame so the user never places coordinates by hand
    # (workflows/motion_aim). onnxruntime executes it; huggingface_hub fetches
    # and caches its weights.
    "onnxruntime>=1,<2",
    "huggingface_hub>=1,<2",
]

[project.scripts]
origenerator = "origenerator.app:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "pytest-qt>=4,<5", "pytest-timeout>=2.4,<3", "vulture>=2.16,<3",
       "ruff==0.16.6"]
# What voice_core, the family's listener, reads each command with a second time and
# takes sentences down with. voice_core imports it only when an app asks for either;
# this app asks for both, so it installs it. Vosk and the microphone come with voice_core.
# Install with:  pip install -e .[voice]
voice = ["faster-whisper>=1,<2"]

[tool.pytest.ini_options]
# The content guard's enforcement check, adopted the way every repo in the
# family adopts it: one line, and no copy of the check to drift.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the list sits beside the checkouts, so a fresh CI clone has none. Nothing CI runs
# here goes much past a second. The ceiling stays the family's highest because
# this is its largest suite, and because a session-scoped fixture's teardown
# is charged to whichever test ran last -- here a full widget-count sweep and
# gc over a run that built thousands of Qt panels. --timeout-method=thread is
# the half that pays for itself: it dumps the stack of the test that stopped,
# which turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p app_support.sanitize.pytest_plugin -p app_support.coverage_gate --cov --cov-report= --timeout=240 --timeout-method=thread"
testpaths = ["tests"]
qt_api = "pyqt6"

# The family checkouts this one is installed beside. All three were imported and
# named nowhere in this file, so the only record of what a checkout needs was
# the CI workflow. None is published, so none can go in [project.dependencies];
# tests/test_dependencies.py holds this list against the tree instead.
[tool.haglio]
siblings = ["app_support", "player_core", "shared_ui", "voice_core"]

# What Origenerator's two launchers start: launch_origenerator.vbs, the file the
# pinned shortcut runs, and launch_preview_branch.vbs, which runs a worktree's
# code as a branch session on the primary checkout's venv. Both are rendered
# from these by `python -m app_support.launcher --write`.
[tool.haglio.launchers."launch_origenerator.vbs"]
app = "Origenerator"
run = "-m origenerator"
named-interpreter = "Origenerator-Origenerator.exe"
log = 'state\origenerator_launcher.log'

[tool.haglio.launchers."launch_preview_branch.vbs"]
app = "Origenerator (branch preview)"
run = "-m origenerator"
venv = "primary"
log = 'state\origenerator_launcher.log'
environment = { ORIGENERATOR_BRANCH_SESSION = "1" }

[tool.setuptools.packages.find]
include = ["origenerator*"]
namespaces = false

# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@claude/repeats-in-every-part-trial
    with:
      siblings: ""
      python-version: "3.14"
      # One job outgrew the queue's 60-minute limit: in October 2026 one pass took
      # 34 to 53 minutes, as fast or slow as the runner it landed on, and four were
      # cancelled at their 55-minute ceiling with nothing failing. Four parts side
      # by side took 4 to 7 minutes each, and a runner can be half as fast as the
      # next, so each part's clock is 30 minutes.
      parts: 4
      timeout-minutes: 30
      qt-platform: offscreen
      # Fun Time, beside this checkout at its default branch: what it relies on of
      # this app (its tests/origenerator_expectations.json) is held to this app
      # by tests/test_fun_time_expectations.py, so a change that would break a
      # room is refused here rather than after it ships. Cloned and not
      # installed -- the check reads one document.
      prepare: |
        set -euo pipefail
        git clone --quiet --depth 1 https://github.com/haglio/fun_time.git ../fun_time

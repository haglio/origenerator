[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "origenerator"
version = "0.1.0"
description = "Local ComfyUI frontend with metadata tracking and gallery browser"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "Pillow",
    "opencv-python>=4.8",
    "websockets",
    "numpy",
    # Auto-aiming the ATI stroke track: a censor-detection YOLO finds the anchor
    # in a start frame so the user never places coordinates by hand
    # (workflows/stroke_aim). onnxruntime executes it; huggingface_hub fetches
    # and caches its weights.
    "onnxruntime",
    "huggingface_hub",
]

[project.scripts]
origenerator = "origenerator.app:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-timeout", "vulture", "ruff"]
# Voice-command prompt editing: local speech-to-text + mic capture. Heavy and
# optional — the mic button degrades gracefully when these aren't installed.
# Install with:  pip install -e .[voice]
voice = ["faster-whisper", "sounddevice"]

[tool.pytest.ini_options]
# The content guard's enforcement check, adopted the way every repo in the
# family adopts it: one line, and no copy of the check to drift.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. Nothing CI runs
# here goes much past a second. The ceiling stays the family's highest because
# this is its largest suite, and because a session-scoped fixture's teardown
# is charged to whichever test ran last -- here a full widget-count sweep and
# gc over a run that built thousands of Qt panels. --timeout-method=thread is
# the half that pays for itself: it dumps the hung stack, which turns a
# stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds all three halves of it.
addopts = "-p app_support.sanitize.pytest_plugin --timeout=240 --timeout-method=thread"
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.setuptools.packages.find]
include = ["origenerator*"]
namespaces = false
